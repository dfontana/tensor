[tools]
lua = "latest"
lua-language-server = "latest"
rust = "latest"
# luarocks install busted fennel luasocket
# luasec needs openssel (brew install openssl)
# luarocks install luasec OPENSSL_DIR="$(brew --prefix openssl)"

[tasks."build:native"]
description = "Format, lint, and compile the native Rust module"
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs", ".cargo/config.toml"]
outputs = ["target/debug/libtensor_native.*"]
run = """
cargo fmt --check
cargo clippy --all-targets -- -D warnings
cargo build
"""

[tasks."release:native"]
description = "Build the native Lua module used by Fennel"
sources = ["Cargo.toml", "Cargo.lock", "src/**/*.rs", ".cargo/config.toml"]
outputs = ["build/lua/tensor_native.so"]
run = """
cargo build --release
mkdir -p build/lua
case "$(uname -s)" in
  Darwin) artifact=target/release/libtensor_native.dylib ;;
  Linux) artifact=target/release/libtensor_native.so ;;
  *) printf '%s\\n' "Unsupported native module platform: $(uname -s)" >&2; exit 1 ;;
esac
cp "$artifact" build/lua/tensor_native.so
"""

[tasks."test:native"]
description = "Run Rust unit tests"
run = "cargo test"

[tasks.test]
description = "Run the tensor test suite"
depends = ["release:native"]
run = "LUA_CPATH='./build/lua/?.so;;' busted -e 'require(\"fennel\").install(); require(\"test.helper\")' --loaders fennel test/native_spec.fnl test/optimizer_spec.fnl test/tensor_spec.fnl test/vocab_spec.fnl"

[tasks."test:fallback"]
description = "Run the explicit no-native Fennel fallback suite"
depends = ["release:native"]
run = "TENSOR_FORCE_NO_NATIVE=1 LUA_CPATH='./build/lua/?.so;;' busted -e 'require(\"fennel\").install(); require(\"test.helper\")' --loaders fennel test/fallback_spec.fnl"

[tasks."test:nd"]
description = "Run the opt-in deferred N-D tensor suite"
depends = ["release:native"]
run = "LUA_CPATH='./build/lua/?.so;;' busted -e 'require(\"fennel\").install(); require(\"test.helper\")' --loaders fennel test/nd_spec.fnl"

[tasks.benchmark]
description = "Compare native Storage and Lua-table elementwise addition"
depends = ["release:native"]
run = "LUA_CPATH='./build/lua/?.so;;' lua bench/storage.lua"

[tasks.main]
description = "Run the tensor example"
depends = ["release:native"]
run = "LUA_CPATH='./build/lua/?.so;;' fennel fnl/main.fnl"
